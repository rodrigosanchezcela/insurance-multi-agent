[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-multi-agent"
version = "0.1.0"
description = "Multi-agent system for insurance processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langchain-openrouter>=0.0.2",
    "langgraph>=1.0.8",
    "pdf2image>=1.17.0",
    "pydantic-ai>=1.62.0",
    "pymupdf>=1.27.1",
    "pytesseract>=0.3.13",
    "tesseract>=0.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_multi_agent"]
